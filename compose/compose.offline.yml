# =============================================================================
# compose/compose.offline.yml
#
# Override applied ON TOP of compose.yml to run the workflow WITHOUT INTERNET
# (added by compose/run_workflow.sh when GTA_OFFLINE=true).
#
# The stack network becomes "internal": the containers (workflow, Postgres,
# GeoServer, GeoNetwork) reach each other, but nothing goes out to the
# internet. Any network call left in the code therefore makes the run fail.
#
# The images must already be available locally (docker pull or build first).
# Ports published on the host cannot be reached in this mode.
# =============================================================================
networks:
  default:
    internal: true
