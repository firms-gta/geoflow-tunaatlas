name: gta

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: gta
  DB_USER: gta
  DB_PASSWORD: gta
  DB_USER_READONLY: gta_reader
  DB_PASSWORD_READONLY: ${SHINY_DB_PASSWORD:-gta_reader}

x-gta-env: &gta-env
  <<: *db-env
  GEOSERVER_URL: http://geoserver:8080/geoserver
  GEOSERVER_PUBLIC_URL: http://localhost:${GTA_GEOSERVER_PORT:-18080}/geoserver
  GEOSERVER_USER: admin
  GEOSERVER_PASSWORD: geoserver
  GEOSERVER_WORKSPACE: tunaatlas
  GEOSERVER_STORE: tunaatlas
  GEONETWORK_URL: http://geonetwork:8080/geonetwork
  GEONETWORK_USER: admin
  GEONETWORK_PASSWORD: admin
  GEONETWORK_VERSION: "4.4"
  GTA_STEPS: ${GTA_STEPS:-services}
  GTA_DATA_SOURCE: volume_dir
  GTA_DATA_PATH: /home/rstudio/geoflow-tunaatlas/data/GTA_2026
  GTA_SUMMARISE_INVALID_RAW: "false"
  GTA_BOOTSTRAP_RESTORE_RENV: "false"

x-gta-volumes: &gta-volumes
  - ../runtime/extracted/all_raw_data_GTA:/home/rstudio/geoflow-tunaatlas/data/GTA_2026
  - ../runtime/jobs:/home/rstudio/geoflow-tunaatlas/jobs
  - ../runtime/cache:/cache
  - ../docker_local.env.compose:/home/rstudio/geoflow-tunaatlas/docker_local.env.compose:ro
  - ../zenodo_secrets.env:/home/rstudio/geoflow-tunaatlas/zenodo_secrets.env

services:
  workflow:
    build:
      context: ..
      dockerfile: compose/Dockerfile.workflow
    image: ${GTA_IMAGE:-ghcr.io/firms-gta/gta-workflow:sha-420350c-dev}
    # Profil : "docker compose up" ne lance pas le workflow. Il ne démarre que
    # nommément ("docker compose run workflow", ce que font les scripts).
    profiles: ["workflow"]
    environment: *gta-env
    volumes: *gta-volumes
    depends_on:
      postgres:
        condition: service_healthy
      geoserver:
        condition: service_healthy
      geonetwork:
        condition: service_healthy

  rstudio:
    image: ${GTA_RSTUDIO_IMAGE:-ghcr.io/firms-gta/gta-workflow:sha-af1c837-dev-rstudio}
    build:
      context: ..
      dockerfile: compose/Dockerfile.rstudio
      args:
        BASE_IMAGE: ${GTA_IMAGE:-ghcr.io/firms-gta/gta-workflow:sha-af1c837-dev}
    ports:
      - "127.0.0.1:${GTA_RSTUDIO_PORT:-18787}:8787"
    environment:
      <<: *gta-env
      PASSWORD: test
      USERID: 1000
      GROUPID: 1000
    volumes:
      - ../R:/home/rstudio/geoflow-tunaatlas/R
      - ../config:/home/rstudio/geoflow-tunaatlas/config
      - ../compose:/home/rstudio/geoflow-tunaatlas/compose
      - ../runtime/extracted/all_raw_data_GTA:/home/rstudio/geoflow-tunaatlas/data/GTA_2026
      - ../runtime/jobs:/home/rstudio/geoflow-tunaatlas/jobs
      - ../runtime/cache:/cache
      - ../docker_local.env.compose:/home/rstudio/geoflow-tunaatlas/docker_local.env.compose:ro
      - ../zenodo_secrets.env:/home/rstudio/geoflow-tunaatlas/zenodo_secrets.env:ro
    depends_on:
      - postgres
      - geoserver
      - geonetwork

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: gta
      POSTGRES_USER: gta
      POSTGRES_PASSWORD: gta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:${GTA_PG_PORT:-15430}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gta -d gta"]
      interval: 5s
      retries: 20

  shiny:
    image: ghcr.io/firms-gta/tunaatlas_pie_map_shiny:${SHINY_TAG:-latest}
    environment:
      <<: *db-env
      # l'application se connecte avec DB_USER_READONLY (gta_reader) et DB_PASSWORD
      DB_USER: gta_reader
      DB_PASSWORD: ${SHINY_DB_PASSWORD:-gta_reader}
    ports:
      - "127.0.0.1:${GTA_SHINY_PORT:-13838}:3838"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.5
    environment:
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:${GTA_GEONETWORK_PORT:-18081}"
      CORS_ALLOWED_METHODS: "GET,POST,HEAD,OPTIONS"
    ports:
      - "127.0.0.1:${GTA_GEOSERVER_PORT:-18080}:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 10s
      retries: 30
      start_period: 30s

  elasticsearch:
    image: elasticsearch:8.19.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  geonetwork:
    image: geonetwork:4.4.12
    environment:
      DATA_DIR: /catalogue-data
      ES_HOST: elasticsearch
      ES_PROTOCOL: http
      ES_PORT: 9200
      GN_CONFIG_PROPERTIES: >-
        -Dgeonetwork.dir=/catalogue-data
        -Dgeonetwork.formatter.dir=/catalogue-data/data/formatter
        -Dgeonetwork.schema.dir=/opt/geonetwork/WEB-INF/data/config/schema_plugins
        -Dgeonetwork.indexConfig.dir=/opt/geonetwork/WEB-INF/data/config/index
        -Des.host=elasticsearch
        -Des.port=9200
        -Des.protocol=http
        -Des.url=http://elasticsearch:9200
        -Dproxy.allowPorts=80,443,8080
      GEONETWORK_DB_TYPE: postgres
      GEONETWORK_DB_HOST: postgres
      GEONETWORK_DB_PORT: 5432
      GEONETWORK_DB_NAME: geonetwork
      GEONETWORK_DB_USERNAME: gta
      GEONETWORK_DB_PASSWORD: gta
    volumes:
      - geonetwork_data:/catalogue-data
    ports:
      - "127.0.0.1:${GTA_GEONETWORK_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Accept: application/json' http://localhost:8080/geonetwork/srv/api/site || exit 1"]
      interval: 10s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_healthy

volumes:
  postgres_data:
  geoserver_data:
  elasticsearch_data:
  geonetwork_data: