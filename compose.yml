# =============================================================================
# compose.yml: the Global Tuna Atlas stack (the single compose file)
#
# Every value comes from .env (cp .env.example .env, then fill it in). Nothing
# has a hidden default here: a missing variable stops `docker compose` and
# names it.
#
#   docker compose up -d            # PostGIS, GeoServer, GeoNetwork, Shiny, RStudio
#   ./docker/run_workflow.sh        # the workflow (profile "workflow"), sample data
#   ./docker/run_full_workflow.sh   # the workflow on the real data
#
# Offline mode: GTA_OFFLINE=true makes the stack network internal (the
# containers reach each other, nothing reaches the internet).
# =============================================================================
name: gta

services:
  workflow:
    build:
      context: .
      dockerfile: Dockerfile
      target: workflow
    image: ${GTA_IMAGE:?set GTA_IMAGE in .env}
    # Profile: `docker compose up` does not start the workflow. It only starts
    # by name (`docker compose run workflow`, which the scripts do).
    profiles: ["workflow"]
    env_file: .env
    volumes:
      - ${GTA_DATA_DIR:?set GTA_DATA_DIR in .env}:/home/rstudio/geoflow-tunaatlas/data/GTA_2026
      - ./runtime/jobs:/home/rstudio/geoflow-tunaatlas/jobs
      - ./runtime/cache:/cache
      - ./.env:/home/rstudio/geoflow-tunaatlas/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      geoserver:
        condition: service_healthy
      geonetwork:
        condition: service_healthy

  rstudio:
    build:
      context: .
      dockerfile: Dockerfile
      target: rstudio
    image: ${GTA_RSTUDIO_IMAGE:?set GTA_RSTUDIO_IMAGE in .env}
    ports:
      - "127.0.0.1:${GTA_RSTUDIO_PORT:?set GTA_RSTUDIO_PORT in .env}:8787"
    env_file: .env
    environment:
      PASSWORD: ${RSTUDIO_PASSWORD:?set RSTUDIO_PASSWORD in .env}
      USERID: 1000
      GROUPID: 1000
    volumes:
      - ./R:/home/rstudio/geoflow-tunaatlas/R
      - ./config:/home/rstudio/geoflow-tunaatlas/config
      - ./workflow:/home/rstudio/geoflow-tunaatlas/workflow
      - ./docker:/home/rstudio/geoflow-tunaatlas/docker
      - ./data:/home/rstudio/geoflow-tunaatlas/data
      - ${GTA_DATA_DIR:?set GTA_DATA_DIR in .env}:/home/rstudio/geoflow-tunaatlas/data/GTA_2026
      - ./runtime/jobs:/home/rstudio/geoflow-tunaatlas/jobs
      - ./runtime/cache:/cache
      - ./.env:/home/rstudio/geoflow-tunaatlas/.env:ro
      - ./renv.lock:/home/rstudio/geoflow-tunaatlas/renv.lock:ro
    depends_on:
      - postgres
      - geoserver
      - geonetwork

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:${GTA_PG_PORT:?set GTA_PG_PORT in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  shiny:
    image: ghcr.io/firms-gta/tunaatlas_pie_map_shiny:${SHINY_TAG:?set SHINY_TAG in .env}
    # The application connects with the read-only account
    environment:
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?set DB_PORT in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER_READONLY:?set DB_USER_READONLY in .env}
      DB_PASSWORD: ${DB_PASSWORD_READONLY:?set DB_PASSWORD_READONLY in .env}
      DB_USER_READONLY: ${DB_USER_READONLY:?set DB_USER_READONLY in .env}
      DB_PASSWORD_READONLY: ${DB_PASSWORD_READONLY:?set DB_PASSWORD_READONLY in .env}
    ports:
      - "127.0.0.1:${GTA_SHINY_PORT:?set GTA_SHINY_PORT in .env}:3838"
    depends_on:
      postgres:
        condition: service_healthy

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.5
    environment:
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:${GTA_GEONETWORK_PORT:?set GTA_GEONETWORK_PORT in .env}"
      CORS_ALLOWED_METHODS: "GET,POST,HEAD,OPTIONS"
    ports:
      - "127.0.0.1:${GTA_GEOSERVER_PORT:?set GTA_GEOSERVER_PORT in .env}:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 10s
      retries: 30
      start_period: 30s

  elasticsearch:
    image: elasticsearch:8.19.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:?set ES_JAVA_OPTS in .env}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  geonetwork:
    image: geonetwork:4.4.12
    environment:
      DATA_DIR: /catalogue-data
      ES_HOST: elasticsearch
      ES_PROTOCOL: http
      ES_PORT: 9200
      GN_CONFIG_PROPERTIES: >-
        -Dgeonetwork.dir=/catalogue-data
        -Dgeonetwork.formatter.dir=/catalogue-data/data/formatter
        -Dgeonetwork.schema.dir=/opt/geonetwork/WEB-INF/data/config/schema_plugins
        -Dgeonetwork.indexConfig.dir=/opt/geonetwork/WEB-INF/data/config/index
        -Des.host=elasticsearch
        -Des.port=9200
        -Des.protocol=http
        -Des.url=http://elasticsearch:9200
        -Dproxy.allowPorts=80,443,8080
      GEONETWORK_DB_TYPE: postgres
      GEONETWORK_DB_HOST: postgres
      GEONETWORK_DB_PORT: 5432
      GEONETWORK_DB_NAME: geonetwork
      GEONETWORK_DB_USERNAME: ${DB_USER:?set DB_USER in .env}
      GEONETWORK_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - geonetwork_data:/catalogue-data
    ports:
      - "127.0.0.1:${GTA_GEONETWORK_PORT:?set GTA_GEONETWORK_PORT in .env}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Accept: application/json' http://localhost:8080/geonetwork/srv/api/site || exit 1"]
      interval: 10s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_healthy

networks:
  default:
    internal: ${GTA_OFFLINE:?set GTA_OFFLINE in .env (true or false)}

volumes:
  postgres_data:
  geoserver_data:
  elasticsearch_data:
  geonetwork_data:
