name: Workflow launcher checks

on:
  pull_request:
    paths:
      - "R/launching_workflows/**"
      - "compose/Dockerfile.workflow"
      - ".Rprofile"
      - "tests/smoke_test_launcher.R"
      - ".github/workflows/workflow-launcher-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R 4.2.3
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2.3"
          use-public-rspm: true

      - name: Parse launcher scripts
        shell: Rscript {0}
        run: |
          parse("R/launching_workflows/GTA_2026_creation.R")
          parse("R/launching_workflows/run_gta_2026_workflow_cli.R")

      - name: Run launcher smoke tests
        run: Rscript tests/smoke_test_launcher.R

      - name: Check workflow Dockerfile
        run: |
          F=compose/Dockerfile.workflow
          grep -q 'ENV PROJECT_DIR=/home/rstudio/geoflow-tunaatlas' "$F"
          # patches geoflow 1.3.0 indispensables à la publication (GeoServer, Zenodo)
          grep -qF 's/c("Postgres","PostreSQL")/c("Postgres","PostgreSQL")/g' "$F"
          grep -q 'patch-geoflow-zenodo.R' "$F"
          grep -q 'patch-geoflow-zenodo-size' "$F"
          # le correctif geometa doit être rechargé à chaque session
          grep -q 'compose/patches/patch-geometa.R' .Rprofile