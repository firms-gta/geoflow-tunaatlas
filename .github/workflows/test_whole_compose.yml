name: CI GTA workflow

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  gta-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GTA_IMAGE: gta-workflow:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Application cache
        uses: actions/cache@v4
        with:
          path: runtime/cache
          key: gta-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            gta-cache-${{ github.ref_name }}-
            gta-cache-

      - uses: docker/setup-buildx-action@v3

      # Before the build: the Docker cache is read from and written to GHCR.
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer cache on GHCR (tag "buildcache", not a runnable image): unlike the
      # GitHub Actions cache, it does not expire after 7 days, is not limited to
      # 10 GB and is shared by all branches. As long as renv.lock does not
      # change, the renv::restore() layer is reused.
      - name: Build the image from the commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/Dockerfile.workflow
          tags: ${{ env.GTA_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=registry,ref=ghcr.io/firms-gta/gta-workflow:buildcache
          cache-to: type=registry,ref=ghcr.io/firms-gta/gta-workflow:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Prepare the runner
        run: |
          mkdir -p runtime/jobs runtime/cache \
                   tests/sample_data/dataoutputpreharmo tests/sample_data/dataoutputGTA
          cat > zenodo_secrets.env <<EOF
          ZENODO_URL=https://sandbox.zenodo.org/api
          ZENODO_TOKEN=${{ secrets.ZENODO_SANDBOX_TOKEN }}
          EOF
          cat > docker_local.env.compose <<'EOF'
          DB_DRV=PostgreSQL
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=gta
          DB_USER=gta
          DB_PASSWORD=gta
          DB_USER_READONLY=gta_reader
          DB_PASSWORD_READONLY=gta_reader
          GTA_DB_UPLOAD=true
          RUN_ZENODO_T_F=true
          EOF
          # the container runs as 1000:1000 (rstudio), the runner as 1001
          sudo chown -R 1000:1000 runtime tests/sample_data R config

      - name: Run the workflow
        timeout-minutes: 90
        env:
          GTA_RUN_USER: "1000:1000"
          GTA_STEPS: DB,rawdata,nominal,effort,level0,level1,services
          GTA_MOUNT_CODE: "false"
        run: ./compose/run_workflow.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker compose \
            -f compose/compose.yml \
            -f compose/compose.ci.yml \
            logs

      - name: Give the cache back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" runtime

      - name: Push the tested image to GHCR
        if: success() && github.event_name == 'push'
        run: |
          REPO=ghcr.io/firms-gta/gta-workflow
          SHA=sha-${GITHUB_SHA::7}

          if [[ "$GITHUB_REF_NAME" == "master" ]]; then
            TAGS=("latest" "$SHA")
          else
            BRANCH=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
            TAGS=("${BRANCH}-dev" "${SHA}-dev")
          fi

          for t in "${TAGS[@]}"; do
            docker tag "$GTA_IMAGE" "$REPO:$t"
            docker push "$REPO:$t"
          done
          
      - name: Build and push the RStudio image
        if: success() && github.event_name == 'push'
        run: |
          REPO=ghcr.io/firms-gta/gta-workflow
          if [[ "$GITHUB_REF_NAME" == "master" ]]; then
            BASE=$REPO:sha-${GITHUB_SHA::7}
            MOVING=$REPO:latest-rstudio
          else
            BASE=$REPO:sha-${GITHUB_SHA::7}-dev
            MOVING=$REPO:$(echo "$GITHUB_REF_NAME" | tr '/' '-')-rstudio
          fi
          docker buildx build -f compose/Dockerfile.rstudio \
            --build-arg BASE_IMAGE="$BASE" \
            -t "$BASE-rstudio" -t "$MOVING" --push .
