name: CI GTA workflow

on:
  push:
    branches: [master, feature/mapping-codelist-cloned-in-docker-image]
  workflow_dispatch:

jobs:
  gta-workflow:
    runs-on: ubuntu-latest
    env:
      GTA_IMAGE: gta-workflow:ci-${{ github.sha }}
      COMPOSE_FILE: compose/compose.bd.rstudio.newversiongeoflow.yml
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache applicatif
        uses: actions/cache@v4
        with:
          path: runtime/cache
          key: gta-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            gta-cache-${{ github.ref_name }}-
            gta-cache-
            
      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image depuis le commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/Dockerfile.workflow
          tags: ${{ env.GTA_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Préparer le runner
        run: |
          mkdir -p runtime/jobs runtime/cache
          echo "ZENODO_TOKEN=${{ secrets.ZENODO_SANDBOX_TOKEN }}" > zenodo_secrets.env
          cat > docker_local.env.compose <<'EOF'
          DB_DRV=PostgreSQL
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=gta
          DB_USER=gta
          DB_PASSWORD=gta
          DB_USER_READONLY=gta
          GTA_DB_UPLOAD=true
          RUN_ZENODO_T_F=true
          EOF

      - name: Lancer le workflow
        timeout-minutes: 90
        env:
          GTA_STEPS: DB,rawdata,nominal,level0,services
        run: ./compose/run_workflow_retry.sh
            
            
      - name: Logs en cas d'échec
        if: failure()
        run: |
          docker compose \
            -f compose/compose.bd.rstudio.newversiongeoflow.yml \
            -f compose/compose.ci.yml \
            logs