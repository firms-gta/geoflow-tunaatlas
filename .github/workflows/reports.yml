# Runs the complete GTA workflow on the real data, then renders the summary
# reports (docs/reports/*.Rmd) from the datasets it produced and publishes them
# on GitHub Pages.
#
# The image is the one already tested on the sample data and published by
# test_whole_compose.yml: if it passed the test, it is expected to pass here.
# Nothing is rebuilt.
#
# Processing only: no database, GeoServer, GeoNetwork or Zenodo (GTA_NO_DB=true),
# one container per step so that memory is freed between steps, and the
# intermediate files are deleted as soon as no later step needs them, to fit
# the disk of a GitHub runner. The final datasets (data/GTA_2026/dataoutputGTA)
# are kept as a workflow artifact.
#
# Reports: catch at levels 0, 1 and 2, and effort, all on the datasets of this
# run.
#
# Comparison with an earlier run: the final datasets are summarised
# (gta_run_summary(): sums by year and 5 degree square, a few MB) and compared
# (gta_compare_summaries(), docs/reports/run_comparison.Rmd) with the summary
# of an earlier run, by default the last one archived. The summaries of the
# runs of dev, master and the tags are archived as assets of the GitHub
# release "run-summaries" (kept without time limit, unlike the artifacts); a
# run of another branch is compared but archives nothing, and does not deploy
# GitHub Pages (its pages are in the "github-pages" artifact).
#
# Requires: Settings > Pages > Source = "GitHub Actions".
name: Full run and reports

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Leave empty: uses the image built and tested for this commit. Otherwise a tag of ghcr.io/firms-gta/gta-workflow (e.g. latest)"
        required: false
        default: ""
      datasets_from_run:
        description: "Reports only: ID of an earlier run of this workflow whose final datasets are reused (number in its URL). Empty = complete run"
        required: false
        default: ""
      compare_with:
        description: "Summary to compare with: name of an asset of the release run-summaries without extension (e.g. summary_20261123_324c380). Empty = the last one archived"
        required: false
        default: ""

permissions:
  contents: write   # assets of the release run-summaries
  actions: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PROJECT_DIR: /home/rstudio/geoflow-tunaatlas
  # Raw data of the GTA (see docs/RUNNING.md)
  FROM_RUN: ${{ github.event.inputs.datasets_from_run }}
  COMPARE_WITH: ${{ github.event.inputs.compare_with }}
  SUMMARIES_RELEASE: run-summaries
  # Runs whose summary is archived (reference of the next comparisons)
  ARCHIVE_SUMMARY: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RAW_DATA_URL: https://zenodo.org/records/20834708/files/all_raw_data_GTA.zip?download=1

jobs:
  full-run-and-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 355   # GitHub-hosted jobs stop at 6 h
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and add swap
        if: env.FROM_RUN == ''
        run: |
          df -h /
          # Tools preinstalled on the runner and not used here (~25-30 GB)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /
          # Extra swap: a level that needs a bit more than 16 GB slows down
          # instead of being killed
          sudo fallocate -l 8G /swapfile_gta
          sudo chmod 600 /swapfile_gta
          sudo mkswap /swapfile_gta >/dev/null
          sudo swapon /swapfile_gta
          free -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the workflow image
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          REPO=ghcr.io/firms-gta/gta-workflow
          if [[ -n "$IMAGE_TAG" ]]; then
            CANDIDATES=("$IMAGE_TAG")
          else
            CANDIDATES=("sha-${GITHUB_SHA::7}" "sha-${GITHUB_SHA::7}-dev")
          fi
          for t in "${CANDIDATES[@]}"; do
            if docker pull "$REPO:$t"; then
              echo "IMAGE=$REPO:$t" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No image found for: ${CANDIDATES[*]} (has test_whole_compose.yml passed on this commit?)"
          exit 1

      - name: Download the raw data
        if: env.FROM_RUN == ''
        run: |
          mkdir -p runtime/data runtime/jobs
          wget -q -O raw.zip "$RAW_DATA_URL"
          unzip -q raw.zip -d runtime/unzipped
          rm raw.zip
          # The archive may contain an extra all_raw_data_GTA/ level
          SRC=runtime/unzipped
          if [[ -d runtime/unzipped/all_raw_data_GTA ]]; then SRC=runtime/unzipped/all_raw_data_GTA; fi
          mv "$SRC"/* runtime/data/
          rm -rf runtime/unzipped
          du -sh runtime/data
          df -h /
          # Files the configurations read from data/GTA_2026 that are not in the
          # raw-data archive (code lists, mappings...): taken from data/ in the
          # repository when they are there. Anything still missing stops the
          # run here rather than in the middle of a step.
          missing=()
          for f in $(cat config/entities/*.csv | grep -o '\./data/GTA_2026/[A-Za-z0-9_.-]*' \
                       | grep -v '/dataoutput' | sed 's#^\./data/GTA_2026/##; s#_$##' | sort -u); do
            [[ -e "runtime/data/$f" ]] && continue
            if [[ -e "data/$f" ]]; then
              echo "Not in the archive, taken from the repository: data/$f"
              cp "data/$f" "runtime/data/$f"
            else
              missing+=("$f")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing in the raw-data archive and in data/: ${missing[*]}"
            exit 1
          fi
          # Same user as in the image and in the test (rstudio, 1000:1000):
          # with another uid, R does not find the renv library of the image
          sudo chown -R 1000:1000 runtime

      - name: Run the workflow
        if: env.FROM_RUN == ''
        run: |
          set -euo pipefail
          D=runtime/data
          # Settings of the workflow container (the geoflow configurations load
          # .env). No database here (GTA_NO_DB), the local-stack values are enough.
          cp env.example .env

          step() {   # step <GTA_STEPS> [extra docker run options...]
            local steps="$1"; shift
            echo "::group::$steps"
            docker run --rm \
              --user 1000:1000 \
              -v "$PWD/$D":"$PROJECT_DIR/data/GTA_2026" \
              -v "$PWD/runtime/jobs":"$PROJECT_DIR/jobs" \
              -v "$PWD/.env":"$PROJECT_DIR/.env:ro" \
              -e GTA_STEPS="$steps" \
              -e GTA_DATA_SOURCE=volume_dir \
              -e GTA_DATA_PATH="$PROJECT_DIR/data/GTA_2026" \
              -e GTA_NO_DB=true \
              -e GTA_SUMMARISE_INVALID_RAW=false \
              -e GTA_BOOTSTRAP_RESTORE_RENV=false \
              "$@" \
              "$IMAGE"
            echo "::endgroup::"
            echo "After $steps:"; df -h / | tail -1; sudo du -sh "$D" runtime/jobs
          }

          # Step snapshots (jobs/*/.../Markdown): only read by the summaries
          prune_markdown() { sudo find runtime/jobs -type d -name Markdown -prune -exec rm -rf {} +; }

          # Summaries (CWP.dataset) of one level, from its step snapshots. Each
          # entity gets a gitbook (folder <prefix>recappdf/ in its entity
          # directory): it is copied to summaries/<level>/<entity>/, outside
          # runtime/ (owned by the container user), with an index.html that
          # opens its first page
          summaries() {   # summaries <level0|level1|level2> <job suffix> <GTA_TUNAATLAS_* variable>
            local job book entity out first
            job=$(ls -d runtime/jobs/*"$2" | sort | tail -1)
            step summaries -e "$3=jobs/$(basename "$job")"
            while IFS= read -r book; do
              entity=$(basename "$(dirname "$book")")
              out="summaries/$1/$entity"
              mkdir -p "$out"
              sudo cp -r "$book"/. "$out"/
              sudo chown -R "$(id -u):$(id -g)" "$out"
              if [[ ! -e "$out/index.html" ]]; then
                first=$(cd "$out" && ls summary-of-the-final-provided-data*.html 2>/dev/null | head -1 || true)
                [[ -n "$first" ]] || first=$(cd "$out" && ls *.html 2>/dev/null | head -1 || true)
                printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s">\n' "$first" > "$out/index.html"
              fi
            done < <(sudo find "$job" -type d -name '*recappdf' -prune)
            ls -la "summaries/$1" || echo "::warning::No summary produced for $1"
            prune_markdown
          }

          step rawdata;  prune_markdown
          step nominal;  prune_markdown
          step effort;   prune_markdown
          step level0                                   # reads pre-harmonised catch and effort
          summaries level0 level_0_catch_2026 GTA_TUNAATLAS_LEVEL0_CATCH
          step level2                                   # same + nominal
          summaries level2 level_2_catch_2026 GTA_TUNAATLAS_LEVEL2_CATCH
          sudo rm -rf "$D"/dataoutputpreharmo                # nothing reads it any more
          step level1                                   # reads dataoutputGTA only
          summaries level1 level_1_catch_2026 GTA_TUNAATLAS_LEVEL1_CATCH

          ls -la "$D"/dataoutputGTA

      - name: Give the files back to the runner
        if: always() && env.FROM_RUN == ''
        run: sudo chown -R "$(id -u):$(id -g)" runtime

      - name: Keep the final datasets
        if: env.FROM_RUN == ''
        uses: actions/upload-artifact@v4
        with:
          name: gta-final-datasets-${{ github.sha }}
          path: runtime/data/dataoutputGTA
          retention-days: 14

      - name: Keep the summaries
        if: env.FROM_RUN == ''
        uses: actions/upload-artifact@v4
        with:
          name: gta-summaries-${{ github.sha }}
          path: summaries
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the job logs
        if: always() && env.FROM_RUN == ''
        uses: actions/upload-artifact@v4
        with:
          name: gta-job-logs-${{ github.sha }}
          path: runtime/jobs/**/job-logs.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Reuse the final datasets of an earlier run
        if: env.FROM_RUN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: gta-final-datasets-*
          merge-multiple: true
          path: runtime/data/dataoutputGTA
          run-id: ${{ env.FROM_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render the reports
        run: |
          mkdir -p site
          chmod 777 site
          # Final datasets of this run, as seen from inside the container (/gta)
          pick() { basename "$(ls runtime/data/dataoutputGTA/$1 | grep -v _harmonized | head -1)"; }
          export LEVEL0=/gta/$(pick 'global_catch_ird_level0_*.csv')
          export LEVEL1=/gta/$(pick 'global_catch_ird_level1_*.csv')
          export LEVEL2=/gta/$(pick 'global_catch_ird_level2_*.csv')
          export EFFORT=/gta/$(pick 'global_effort_*.csv')
          echo "level0: $LEVEL0  level1: $LEVEL1  level2: $LEVEL2  effort: $EFFORT"
          # pandoc is in the workflow image; older images do not have it, so it
          # is installed in the throw-away container when missing.
          docker run --rm --user root \
            -v "$PWD/docs/reports":"$PROJECT_DIR/docs/reports" \
            -v "$PWD/runtime/data/dataoutputGTA":/gta:ro \
            -v "$PWD/site":/site \
            -e LEVEL0 -e LEVEL1 -e LEVEL2 -e EFFORT \
            -w "$PROJECT_DIR" \
            "$IMAGE" \
            bash -c '
              set -e
              command -v pandoc >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends pandoc >/dev/null; }
              Rscript -e "
                for (lv in 0:2) {
                  rmarkdown::render(\"docs/reports/summary_catch.Rmd\", output_dir = \"/site\",
                                    output_file = sprintf(\"summary_catch_level%d.html\", lv),
                                    intermediates_dir = tempdir(), envir = new.env(),
                                    params = list(level = as.character(lv),
                                                  data_file = Sys.getenv(paste0(\"LEVEL\", lv))))
                }
                rmarkdown::render(\"docs/reports/summary_effort.Rmd\", output_dir = \"/site\",
                                  intermediates_dir = tempdir(), envir = new.env(),
                                  params = list(data_file = Sys.getenv(\"EFFORT\")))
              "
            '

      # Code of this commit (gta package and report), whatever the image
      - name: Summarise the final datasets
        run: |
          set -euo pipefail
          # Datasets of this run, or of the earlier run they come from
          if [[ -n "$FROM_RUN" ]]; then
            SRC_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN" --jq .head_sha)
            SRC_DATE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN" --jq .created_at)
            SRC_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN" --jq .head_branch)
            SRC_RUN=$FROM_RUN
          else
            SRC_SHA=$GITHUB_SHA; SRC_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            SRC_BRANCH=$GITHUB_REF_NAME; SRC_RUN=$GITHUB_RUN_ID
          fi
          NAME="summary_$(date -u -d "$SRC_DATE" +%Y%m%d)_${SRC_SHA::7}"
          echo "SUMMARY_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p run-summary && chmod 777 run-summary
          docker run --rm \
            -v "$PWD/R":"$PROJECT_DIR/R":ro \
            -v "$PWD/DESCRIPTION":"$PROJECT_DIR/DESCRIPTION":ro \
            -v "$PWD/NAMESPACE":"$PROJECT_DIR/NAMESPACE":ro \
            -v "$PWD/runtime/data/dataoutputGTA":/gta:ro \
            -v "$PWD/run-summary":/out \
            -e NAME="$NAME" \
            -w "$PROJECT_DIR" --entrypoint Rscript "$IMAGE" -e '
              suppressMessages(pkgload::load_all(".", quiet = TRUE, export_all = FALSE))
              s <- gta_run_summary(list.files("/gta", "\\.csv$", full.names = TRUE))
              data.table::fwrite(s, file.path("/out", paste0(Sys.getenv("NAME"), ".csv.gz")))
              print(s[, list(rows = .N, value = sum(measurement_value)), by = list(dataset, measurement_unit)])'
          cat > "run-summary/$NAME.json" <<EOF
          {"commit": "$SRC_SHA", "run": "$SRC_RUN", "date": "$SRC_DATE",
           "branch": "$SRC_BRANCH", "image": "$IMAGE", "input": "$RAW_DATA_URL"}
          EOF
          ls -la run-summary

      - name: Find the summary to compare with
        run: |
          set -euo pipefail
          REF=""
          if gh release view "$SUMMARIES_RELEASE" >/dev/null 2>&1; then
            if [[ -n "$COMPARE_WITH" ]]; then
              REF="$COMPARE_WITH"
            else
              # Names start with the date: the last one, other than this run
              REF=$(gh release view "$SUMMARIES_RELEASE" --json assets --jq '.assets[].name' \
                      | grep -E '^summary_[0-9]{8}_[0-9a-f]{7}\.csv\.gz$' | sed 's/\.csv\.gz$//' \
                      | grep -vx "$SUMMARY_NAME" | sort | tail -1 || true)
            fi
          fi
          if [[ -z "$REF" ]]; then
            echo "::notice::No earlier summary to compare with (release $SUMMARIES_RELEASE empty or missing)"
          else
            mkdir -p reference
            gh release download "$SUMMARIES_RELEASE" --dir reference --pattern "$REF.*"
            ls -la reference
          fi
          echo "REFERENCE_NAME=$REF" >> "$GITHUB_ENV"

      - name: Compare with the earlier run
        if: env.REFERENCE_NAME != ''
        continue-on-error: true   # the datasets and the other reports are kept anyway
        run: |
          set -euo pipefail
          info() {   # short description of a summary, from its .json
            python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("commit %s, run %s, %s, branch %s" % (m["commit"][:7], m["run"], m["date"][:10], m["branch"]))' "$1" 2>/dev/null || echo "$2"
          }
          export PREV_INFO="$(info "reference/$REFERENCE_NAME.json" "$REFERENCE_NAME")"
          export NEW_INFO="$(info "run-summary/$SUMMARY_NAME.json" "$SUMMARY_NAME")"
          docker run --rm --user root \
            -v "$PWD/R":"$PROJECT_DIR/R":ro \
            -v "$PWD/DESCRIPTION":"$PROJECT_DIR/DESCRIPTION":ro \
            -v "$PWD/NAMESPACE":"$PROJECT_DIR/NAMESPACE":ro \
            -v "$PWD/docs/reports":"$PROJECT_DIR/docs/reports" \
            -v "$PWD/reference":/reference:ro \
            -v "$PWD/run-summary":/new:ro \
            -v "$PWD/site":/site \
            -e PREV="/reference/$REFERENCE_NAME.csv.gz" -e NEW="/new/$SUMMARY_NAME.csv.gz" \
            -e PREV_INFO -e NEW_INFO \
            -w "$PROJECT_DIR" "$IMAGE" \
            bash -c '
              set -e
              command -v pandoc >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends pandoc >/dev/null; }
              Rscript -e "
                rmarkdown::render(\"docs/reports/run_comparison.Rmd\", output_dir = \"/site\",
                                  intermediates_dir = tempdir(), envir = new.env(),
                                  params = list(previous = Sys.getenv(\"PREV\"), new = Sys.getenv(\"NEW\"),
                                                previous_label = \"previous\", new_label = \"this run\",
                                                previous_info = Sys.getenv(\"PREV_INFO\"),
                                                new_info = Sys.getenv(\"NEW_INFO\"),
                                                markdown_file = \"/site/run_comparison_summary.md\"))
              "
            '

      - name: Keep the comparison
        if: env.REFERENCE_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: gta-run-comparison-${{ github.sha }}
          path: site/run_comparison.html
          retention-days: 90

      # Short version of the comparison on the summary page of this run,
      # readable without downloading anything
      - name: Comparison on the run page
        if: always() && env.REFERENCE_NAME != ''
        run: |
          {
            echo "## Comparison with ${REFERENCE_NAME}"
            echo
            if [[ -f site/run_comparison_summary.md ]]; then
              cat site/run_comparison_summary.md
              echo
              echo "Full report with the plots: artifact \`gta-run-comparison-${GITHUB_SHA}\` of [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) (file \`run_comparison.html\`)."
            else
              echo ":x: The comparison failed: see the step \"Compare with the earlier run\"."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f site/run_comparison_summary.md   # not a page of the site

      - name: Archive the summary
        if: env.ARCHIVE_SUMMARY == 'true'
        run: |
          set -euo pipefail
          if ! gh release view "$SUMMARIES_RELEASE" >/dev/null 2>&1; then
            gh release create "$SUMMARIES_RELEASE" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Run summaries" \
              --notes "Aggregated summaries of the final datasets of the complete runs (reports.yml), one per run: reference of the run comparisons. Not a release of the Global Tuna Atlas."
          fi
          gh release upload "$SUMMARIES_RELEASE" --clobber \
            "run-summary/$SUMMARY_NAME.csv.gz" "run-summary/$SUMMARY_NAME.json"

      - name: Build the index page
        run: |
          # Summaries of this run (not available in reports-only mode)
          summaries_html=""
          if [[ -d summaries ]]; then
            mkdir -p site/summaries
            cp -r summaries/. site/summaries/
            # one link per gitbook: summaries/<level>/<entity>/index.html
            for f in $(cd site && find summaries -mindepth 3 -maxdepth 3 -name index.html | sort); do
              d=$(dirname "$f")
              summaries_html+="<li><a href=\"$f\">$(basename "$(dirname "$d")"): $(basename "$d")</a></li>"
            done
          fi
          [[ -n "$summaries_html" ]] && summaries_html="<h2>Processing summaries (step by step)</h2><ul>$summaries_html</ul>"
          if [[ -f site/run_comparison.html ]]; then
            comparison_html="<h2>Comparison with an earlier run</h2><ul><li><a href=\"run_comparison.html\">This run compared with ${REFERENCE_NAME}</a></li></ul>"
          elif [[ -n "$REFERENCE_NAME" ]]; then
            comparison_html="<h2>Comparison with an earlier run</h2><p>The comparison with ${REFERENCE_NAME} failed: see the step \"Compare with the earlier run\" of the run.</p>"
            echo "::warning::The comparison with $REFERENCE_NAME failed (step 'Compare with the earlier run')"
          else
            comparison_html="<h2>Comparison with an earlier run</h2><p>No earlier run summary to compare with.</p>"
          fi
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Global Tuna Atlas - reports</title>
          <style>body{font-family:sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.5}</style>
          </head><body>
          <h1>Global Tuna Atlas - reports</h1>
          <ul>
            <li><a href="summary_catch_level0.html">Catch dataset analysis (IRD Level 0)</a></li>
            <li><a href="summary_catch_level1.html">Catch dataset analysis (IRD Level 1)</a></li>
            <li><a href="summary_catch_level2.html">Catch dataset analysis (IRD Level 2)</a></li>
            <li><a href="summary_effort.html">Effort dataset analysis</a></li>
          </ul>
          ${comparison_html}
          ${summaries_html}
          <p>Rendered on $(date -u +%Y-%m-%d) from commit
          <code>${GITHUB_SHA::7}</code> with image <code>${IMAGE}</code>,
          on the datasets produced by the complete workflow run of this commit.</p>
          </body></html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Separate job: the github-pages environment may only accept some branches or
  # tags (Settings > Environments > github-pages). If it refuses, only this job
  # fails; the run, the reports (artifact "github-pages") and the datasets are
  # kept.
  # Only dev, master and the tags publish the pages: a run of another branch
  # (e.g. to check its differences before a merge) leaves them as they are.
  deploy:
    needs: full-run-and-reports
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
